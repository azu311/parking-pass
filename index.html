<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>駐車証ジェネレーター | VOREAS HOKKAIDO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');

:root{
  --ink:#221815;
  --paper:#ffffff;
  --bg:#eae7e1;
  --accent:#b7312c;
  --line:#d8d4cc;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Noto Sans JP', -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.app{ display:flex; min-height:100vh; }

/* ---------- controls ---------- */
.controls{
  width:380px; flex:none;
  background:var(--paper);
  border-right:1px solid var(--line);
  padding:28px 24px 40px;
  overflow-y:auto;
  height:100vh;
  position:sticky; top:0;
}
.controls h1{
  font-size:15px; font-weight:900; letter-spacing:.04em;
  margin:0 0 2px;
}
.controls .sub{
  font-size:11px; color:#8a8378; margin:0 0 24px;
}
.field{ margin-bottom:20px; }
.field label{
  display:block; font-size:12px; font-weight:700; margin-bottom:7px; color:#4a433c;
}
.field .hint{ font-size:11px; color:#9a9288; margin-top:6px; line-height:1.5; }
.field input[type="text"]{
  width:100%; padding:10px 11px; font-size:14px;
  border:1px solid #c9c3b8; border-radius:5px; background:#fdfcfa;
  font-family:inherit; color:var(--ink);
}
.field input[type="text"]:focus{ outline:2px solid #221815; outline-offset:1px; }

.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip{
  font-size:11.5px; padding:5px 10px; border-radius:99px;
  border:1px solid #c9c3b8; background:#fff; cursor:pointer; color:#4a433c;
}
.chip:hover{ border-color:var(--ink); color:var(--ink); }

.radio-group{ display:flex; flex-direction:column; gap:8px; }
.radio-row{
  display:flex; align-items:flex-start; gap:9px; padding:10px 12px;
  border:1px solid #c9c3b8; border-radius:6px; cursor:pointer; background:#fdfcfa;
}
.radio-row.active{ border-color:var(--ink); background:#fff; box-shadow:0 0 0 1px var(--ink) inset; }
.radio-row input{ margin-top:3px; }
.radio-row .rtitle{ font-size:13px; font-weight:700; }
.radio-row .rdesc{ font-size:11.5px; color:#8a8378; margin-top:2px; }

.select-wrap select{
  width:100%; padding:10px 11px; font-size:14px; border:1px solid #c9c3b8;
  border-radius:5px; background:#fdfcfa; font-family:inherit; color:var(--ink);
}

.btn{
  width:100%; padding:13px; font-size:14px; font-weight:700;
  border-radius:6px; border:none; cursor:pointer; font-family:inherit;
}
.btn-primary{ background:var(--ink); color:#fff; }
.btn-primary:hover{ background:#000; }
.btn-secondary{
  background:#fff; color:var(--ink); border:1px solid #c9c3b8; margin-top:10px;
}
.btn-secondary:hover{ border-color:var(--ink); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }

.error-box{
  font-size:12px; color:#a3352f; background:#fbeceb; border:1px solid #f0c9c7;
  border-radius:6px; padding:9px 11px; margin-top:8px; display:none;
}
.count-box{
  font-size:12px; color:#3d6b3d; background:#eef5ec; border:1px solid #cfe6c9;
  border-radius:6px; padding:9px 11px; margin-top:8px; display:none;
}

.divider{ height:1px; background:var(--line); margin:24px 0; }

/* ---------- preview area ---------- */
.preview-area{ flex:1; padding:32px; overflow:auto; }
.preview-toolbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; gap:12px; flex-wrap:wrap;
}
.preview-toolbar .status{ font-size:13px; color:#6b6459; }
.nav-controls{ display:flex; align-items:center; gap:10px; }
.nav-btn{
  padding:9px 14px; border-radius:6px; border:1px solid #c9c3b8; background:#fff;
  cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); font-family:inherit;
}
.nav-btn:hover:not(:disabled){ border-color:var(--ink); }
.nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
.nav-jump{
  font-size:13px; padding:8px 10px; border:1px solid #c9c3b8; border-radius:6px;
  font-family:inherit; width:90px; text-align:center;
}

.empty-state{
  display:flex; align-items:center; justify-content:center; height:60vh;
  color:#a39c8f; font-size:14px; text-align:center; line-height:1.8;
}

.cards-wrap{ display:flex; flex-direction:column; align-items:center; gap:24px; }

/* ---------- the permit card (A4 landscape) ---------- */
.card{
  width:297mm; height:210mm; max-width:100%;
  aspect-ratio:297/210;
  background:#fff;
  box-shadow:0 6px 24px rgba(0,0,0,.16);
  position:relative;
  display:flex; flex-direction:column;
  padding:6% 7%;
  flex:none;
}
.card .logo-row{
  flex:0 0 20%;
  display:flex; align-items:center; justify-content:center;
}
.card .logo-row img{ height:62%; }

.card .event-row{
  flex:0 0 15%;
  display:flex; align-items:center; justify-content:center;
  padding:0 2%;
}
.card .event-row .event-text{
  font-weight:900; text-align:center; white-space:nowrap;
  font-size:2.6cqmin;
}

.card .affiliation-row{
  flex:1 1 auto;
  background:var(--ink);
  margin:0 -7%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  padding:0 6%;
}
.card .affiliation-row .aff-text{
  color:#fff; font-weight:900; text-align:center; white-space:nowrap;
  letter-spacing:.02em;
}

.card .bottom-row{
  flex:0 0 16%;
  display:flex; align-items:center; justify-content:space-between;
  gap:3%;
  padding-top:1%;
}
.card .bottom-row .date-block{
  font-weight:900; white-space:nowrap;
  font-size:2.2cqmin;
}
.card .bottom-row .no-block{
  display:flex; align-items:center; justify-content:flex-end;
  gap:3%; margin-left:auto;
}
.card .bottom-row .parking-label{
  font-weight:900; white-space:nowrap;
  font-size:2.4cqmin;
}
.card .bottom-row .parking-number{
  font-weight:900; white-space:nowrap;
  font-size:2.4cqmin;
  border-bottom:0.35cqmin solid var(--ink);
  min-width:22%;
  text-align:center;
  padding:0 2% 0.5%;
}

.card{ container-type: size; }

@media print{
  body{ background:#fff; }
  .controls, .preview-toolbar, .no-print{ display:none !important; }
  .preview-area{ padding:0; overflow:visible; }
  .cards-wrap{ gap:0; }
  .card{
    box-shadow:none;
    width:297mm; height:210mm;
    page-break-after:always;
    break-after:page;
  }
  .card:last-child{ page-break-after:auto; }
  @page{ size:297mm 210mm; margin:0; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ===================== CONTROLS ===================== -->
  <div class="controls no-print">
    <h1>駐車証ジェネレーター</h1>
    <p class="sub">VOREAS HOKKAIDO</p>

    <div class="field">
      <label for="eventName">イベント名</label>
      <input type="text" id="eventName" value="2025-26 大同生命 SV.LEAGUE">
    </div>

    <div class="field">
      <label for="affiliation">所属</label>
      <input type="text" id="affiliation" value="チーム関係者">
      <div class="chips">
        <span class="chip" data-val="チーム関係者">チーム関係者</span>
        <span class="chip" data-val="バレーボール協会">バレーボール協会</span>
        <span class="chip" data-val="STAFF">STAFF</span>
        <span class="chip" data-val="VIP">VIP</span>
        <span class="chip" data-val="Class SS">Class SS</span>
      </div>
    </div>

    <div class="field">
      <label for="dateInput">日付（任意）</label>
      <input type="text" id="dateInput" value="" placeholder="例：10/30">
      <div class="hint">駐車証の左下に表示されます。未入力の場合は表示されません。</div>
    </div>

    <div class="field">
      <label for="numberRange">番号</label>
      <input type="text" id="numberRange" value="1-10" placeholder="例：1-10 / 15-18 / 1,3,5">
      <div class="hint">「1-10」で1〜10の10枚、「15-18」で4枚を一括生成します。カンマ区切りで複数指定も可能です（例：1-5,8,12-14）。</div>
      <div class="field" style="margin-top:12px;">
        <label for="padDigits">番号の桁数</label>
        <div class="select-wrap">
          <select id="padDigits">
            <option value="0">桁揃えしない（例：7）</option>
            <option value="2">2桁（例：07）</option>
            <option value="3">3桁（例：007）</option>
          </select>
        </div>
      </div>
      <div class="error-box" id="errorBox"></div>
      <div class="count-box" id="countBox"></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>出力方法</label>
      <div class="radio-group">
        <label class="radio-row active" id="rowBatch">
          <input type="radio" name="mode" value="batch" checked>
          <div>
            <div class="rtitle">まとめて出力</div>
            <div class="rdesc">生成した全枚数を1回の印刷でまとめて出力します</div>
          </div>
        </label>
        <label class="radio-row" id="rowSingle">
          <input type="radio" name="mode" value="single">
          <div>
            <div class="rtitle">1枚ずつ出力</div>
            <div class="rdesc">プレビューで1枚ずつ確認しながら個別に印刷します</div>
          </div>
        </label>
      </div>
    </div>

    <button class="btn btn-primary" id="generateBtn">生成する</button>
    <button class="btn btn-secondary" id="printBtn" disabled>印刷 / PDF出力</button>
  </div>

  <!-- ===================== PREVIEW ===================== -->
  <div class="preview-area">
    <div class="preview-toolbar no-print" id="toolbar" style="display:none;">
      <div class="status" id="statusText"></div>
      <div class="nav-controls" id="navControls" style="display:none;">
        <button class="nav-btn" id="prevBtn">← 前へ</button>
        <input type="text" class="nav-jump" id="jumpInput" placeholder="No.">
        <button class="nav-btn" id="jumpBtn">表示</button>
        <button class="nav-btn" id="nextBtn">次へ →</button>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      左のフォームに情報を入力し、「生成する」を押してください。<br>
      A4横向きの駐車証プレビューがここに表示されます。
    </div>

    <div class="cards-wrap" id="cardsWrap" style="display:none;"></div>
  </div>

</div>

function parseNumberRange(str){
  const tokens = str.split(/[,、\n]/).map(t=>t.trim()).filter(Boolean);
  const set = new Set();
  for(const token of tokens){
    const rangeMatch = token.match(/^(\d+)\s*[-−ー〜～~]\s*(\d+)$/);
    if(rangeMatch){
      let a = parseInt(rangeMatch[1],10);
      let b = parseInt(rangeMatch[2],10);
      if(isNaN(a) || isNaN(b)) throw new Error('番号の形式が正しくありません: "'+token+'"');
      if(a > b) [a,b] = [b,a];
      if(b - a > 500) throw new Error('一度に生成できる範囲が大きすぎます: "'+token+'"');
      for(let n=a; n<=b; n++) set.add(n);
    } else if(/^\d+$/.test(token)){
      set.add(parseInt(token,10));
    } else {
      throw new Error('番号の形式が正しくありません: "'+token+'"');
    }
  }
  return Array.from(set).sort((a,b)=>a-b);
}

function formatNumber(n, pad){
  pad = parseInt(pad,10);
  if(pad > 0) return String(n).padStart(pad,'0');
  return String(n);
}

function buildCard(num, padDigits){
  const card = document.createElement('div');
  card.className = 'card';
  const eventVal = eventNameInput.value.trim();
  const affVal = affiliationInput.value.trim();
  const numVal = formatNumber(num, padDigits);
  const dateVal = dateInput.value.trim();

  card.innerHTML = `
    <div class="logo-row"><img src="${LOGO_SRC}" alt="VOREAS HOKKAIDO"></div>
    <div class="event-row"><div class="event-text">${escapeHtml(eventVal)}</div></div>
    <div class="affiliation-row"><div class="aff-text">${escapeHtml(affVal)}</div></div>
    <div class="bottom-row">
      <div class="date-block">${escapeHtml(dateVal)}</div>
      <div class="no-block">
        <div class="parking-label">駐車証 No.</div>
        <div class="parking-number">${escapeHtml(numVal)}</div>
      </div>
    </div>
  `;
  return card;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fitText(el, maxSizeCqmin){
  // shrink font-size (in cqmin units approximated via px calc) until it fits container width
  let size = maxSizeCqmin;
  el.style.fontSize = size + 'cqmin';
  // measure using bounding rect; reduce in px terms by switching temporarily
  const parent = el.parentElement;
  let guard = 0;
  while(el.scrollWidth > parent.clientWidth - 4 && size > 4 && guard < 60){
    size -= 0.6;
    el.style.fontSize = size + 'cqmin';
    guard++;
  }
}

function fitAllText(){
  cardsWrap.querySelectorAll('.card').forEach(card=>{
    fitText(card.querySelector('.event-text'), 3.6);
    fitText(card.querySelector('.aff-text'), 9.5);
    const dateEl = card.querySelector('.date-block');
    if(dateEl && dateEl.textContent.trim()) fitText(dateEl, 2.2);
  });
}

function render(){
  cardsWrap.innerHTML = '';
  const padDigits = padDigitsSelect.value;

  if(currentMode === 'batch'){
    navControls.style.display = 'none';
    generatedNumbers.forEach(num=>{
      cardsWrap.appendChild(buildCard(num, padDigits));
    });
    statusText.textContent = `全 ${generatedNumbers.length} 枚をまとめて表示中`;
  } else {
    navControls.style.display = 'flex';
    if(currentIndex < 0) currentIndex = 0;
    if(currentIndex > generatedNumbers.length-1) currentIndex = generatedNumbers.length-1;
    const num = generatedNumbers[currentIndex];
    cardsWrap.appendChild(buildCard(num, padDigits));
    statusText.textContent = `${currentIndex+1} / ${generatedNumbers.length} 枚目（No. ${formatNumber(num,padDigits)}）`;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === generatedNumbers.length-1;
  }

  requestAnimationFrame(fitAllText);
}

generateBtn.addEventListener('click', ()=>{
  errorBox.style.display = 'none';
  countBox.style.display = 'none';
  try{
    const numbers = parseNumberRange(numberRangeInput.value);
    if(numbers.length === 0) throw new Error('番号を入力してください');
    generatedNumbers = numbers;
    currentIndex = 0;
    currentMode = document.querySelector('input[name="mode"]:checked').value;

    emptyState.style.display = 'none';
    cardsWrap.style.display = 'flex';
    toolbar.style.display = 'flex';
    printBtn.disabled = false;

    countBox.textContent = `${numbers.length} 枚分の駐車証を生成しました（No. ${numbers[0]} 〜 No. ${numbers[numbers.length-1]}）`;
    countBox.style.display = 'block';

    render();
  }catch(e){
    errorBox.textContent = e.message;
    errorBox.style.display = 'block';
  }
});

prevBtn.addEventListener('click', ()=>{ currentIndex--; render(); });
nextBtn.addEventListener('click', ()=>{ currentIndex++; render(); });
jumpBtn.addEventListener('click', ()=>{
  const n = parseInt(jumpInput.value,10);
  const idx = generatedNumbers.indexOf(n);
  if(idx >= 0){ currentIndex = idx; render(); }
});

printBtn.addEventListener('click', ()=>{
  window.print();
});
</script>
</body>
</html>
